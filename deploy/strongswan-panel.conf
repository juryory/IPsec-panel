# IPsec Panel 为 strongSwan 增加的全局设置
# - H3C 没有固定公网 IP 时只能用 IKEv1 野蛮模式 + 预共享密钥，strongSwan 默认拒绝，需要显式打开
# - 额外把日志写到文件，面板“日志”页读取（charon-systemd 也会沿用 charon 段的设置）
charon {
  i_dont_care_about_security_and_use_aggressive_mode_psk = yes

  filelog {
    ipsec-panel {
      path = /var/log/ipsec-panel/charon.log
      time_format = %Y-%m-%d %H:%M:%S
      ike_name = yes
      append = yes
      flush_line = yes
      default = 1
      cfg = 1
      ike = 1
      knl = 1
    }
  }
}
